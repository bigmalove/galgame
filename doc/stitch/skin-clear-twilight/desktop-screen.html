<!DOCTYPE html>
<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "daylight-bg": "rgba(255, 255, 255, 0.65)",
              "daylight-bg-hover": "rgba(255, 255, 255, 0.85)",
              "charcoal": "#1a1a1c",
              "sky-accent": "#0ea5e9",
              "sky-accent-light": "#e0f2fe",
              "surface-border": "rgba(0, 0, 0, 0.1)",
              "primary-fixed": "#e0f2fe",
              "on-primary-fixed": "#0369a1",
            },
            fontFamily: {
              "headline": ["Inter", "sans-serif"],
              "body": ["Inter", "sans-serif"],
              "label": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.4rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style type="text/tailwindcss">
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .pattern-overlay {
            background-image: radial-gradient(circle at 1px 1px, rgba(0, 0, 0, 0.05) 1px, transparent 0);
            background-size: 32px 32px;
        }
        .glass-panel {
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .text-shadow-none {
            text-shadow: none;
        }
    </style>
</head>
<body class="bg-white text-charcoal font-body overflow-hidden h-screen w-screen selection:bg-sky-accent-light selection:text-charcoal">
<div class="fixed inset-0 z-0">
<img class="w-full h-full object-cover scale-105 brightness-95" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA7pbg4lQ7Gwzzs55TXr8o348rU_PhsLIPXy1fWUAtM4-SHP6qFsrH6ZlEyIlGAV_HYHJalQTQ0po7_bkQn8YC7xSt1iS6RzBobMpKMz33Ehrz-g3k3kanVeXrIObcjlFslNM7iqObjepszK3MnwRmUjFNN-Ad_FSaSErO8nkjDHi6kmVnfSFEnaI5CVPcMFaSZtOUSsnFqxH6FZExgn96EeAenseurVpd9QSofGfnKUT337UzG2ThmUsnmpcb29vygjnwFJ1PViVw"/>
<div class="absolute inset-0 bg-gradient-to-t from-white/40 via-transparent to-white/10"></div>
</div>
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-8 py-4 bg-white/40 backdrop-blur-xl border-b border-black/5">
<div class="flex items-center gap-6">
<h1 class="text-base font-bold text-charcoal tracking-tight uppercase font-headline">The Ethereal Manuscript</h1>
<div class="h-4 w-px bg-black/10"></div>
<div class="flex gap-4">
<span class="font-headline font-semibold tracking-wider uppercase text-[10px] text-charcoal/80">London, 1888</span>
<span class="font-headline font-semibold tracking-wider uppercase text-[10px] text-charcoal/50">22:15</span>
</div>
</div>
<div class="flex gap-2">
<button class="p-2 text-charcoal hover:bg-black/5 transition-colors duration-200 rounded-full">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
<button class="p-2 text-charcoal hover:bg-black/5 transition-colors duration-200 rounded-full">
<span class="material-symbols-outlined" data-icon="map">map</span>
</button>
<button class="p-2 text-charcoal hover:bg-black/5 transition-colors duration-200 rounded-full">
<span class="material-symbols-outlined" data-icon="schedule">schedule</span>
</button>
</div>
</header>
<main class="relative z-10 h-full w-full flex flex-col px-12 pb-24">
<div class="max-w-5xl mx-auto w-full mb-0 flex justify-end gap-3 px-8">
<button class="glass-panel bg-white/40 hover:bg-white/60 text-charcoal px-5 py-2 rounded-t-lg font-headline font-bold text-[10px] uppercase tracking-[0.15em] flex items-center gap-2 transition-all border-x border-t border-black/5">
<span class="material-symbols-outlined text-sm opacity-70">refresh</span>
<span>重绘当前</span>
</button>
<button class="glass-panel bg-sky-accent/10 hover:bg-sky-accent/20 text-sky-accent px-5 py-2 rounded-t-lg font-headline font-bold text-[10px] uppercase tracking-[0.15em] flex items-center gap-2 transition-all border-x border-t border-sky-accent/20 shadow-sm">
<span class="material-symbols-outlined text-sm">keyboard</span>
<span>自由对话</span>
</button>
</div>
<div class="flex-grow flex items-center justify-center mb-12">
<div class="flex flex-col gap-6 w-full max-w-lg justify-center px-4">
<button class="relative group overflow-hidden glass-panel bg-white/70 hover:bg-white/90 transition-all duration-300 px-8 py-5 rounded-xl border border-black/5 shadow-lg w-full">
<div class="absolute inset-0 pattern-overlay opacity-30 pointer-events-none group-hover:opacity-40"></div>
<span class="relative z-10 text-charcoal font-headline font-bold text-sm uppercase tracking-[0.15em]">Investigate the manuscript</span>
</button>
<button class="relative group overflow-hidden glass-panel bg-white/70 hover:bg-white/90 transition-all duration-300 px-8 py-5 rounded-xl border border-black/5 shadow-lg w-full">
<div class="absolute inset-0 pattern-overlay opacity-30 pointer-events-none group-hover:opacity-40"></div>
<span class="relative z-10 text-charcoal font-headline font-bold text-sm uppercase tracking-[0.15em]">Wait for Alastair</span>
</button>
</div>
</div>
<div class="max-w-5xl mx-auto w-full relative">
<div class="absolute -top-5 left-8 z-20">
<div class="bg-sky-accent-light px-10 py-2 rounded-full shadow-md border border-sky-accent/10">
<span class="font-headline font-bold text-on-primary-fixed tracking-widest text-xs uppercase block">旁白</span>
</div>
</div>
<div class="bg-white/50 glass-panel rounded-2xl overflow-hidden min-h-[160px] flex flex-col p-10 border border-black/5 shadow-xl relative">
<div class="absolute inset-0 pattern-overlay opacity-40 pointer-events-none"></div>
<div class="relative z-10 flex-grow">
<p class="text-charcoal text-xl leading-relaxed font-body font-medium tracking-tight">
                    夕阳的余晖在地板上拉出长长的影子，空气中弥漫着淡淡的尘埃和过往岁月的味道。窗外的城市正在缓慢地沉入蓝调的梦境，而这个房间却仿佛被时间遗忘了，停留在那个永恒的黄昏之中。
                    <span class="inline-flex items-center ml-1 text-sky-accent animate-pulse">
<span class="material-symbols-outlined text-2xl leading-none">arrow_drop_down</span>
</span>
</p>
</div>
</div>
</div>
</main>
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-center py-4 px-12 pb-safe bg-white/60 backdrop-blur-2xl border-t border-black/5 shadow-sm">
<div class="flex items-center gap-1">
<button class="px-3 py-1 font-headline text-[9px] font-bold tracking-widest uppercase text-charcoal/60 hover:text-charcoal hover:bg-black/5 rounded transition-all">LOG</button>
<button class="px-3 py-1 font-headline text-[9px] font-bold tracking-widest uppercase text-charcoal/60 hover:text-charcoal hover:bg-black/5 rounded transition-all">CLOSE</button>
<button class="px-3 py-1 font-headline text-[9px] font-bold tracking-widest uppercase text-charcoal/60 hover:text-charcoal hover:bg-black/5 rounded transition-all">VIEW</button>
<button class="px-3 py-1 font-headline text-[9px] font-bold tracking-widest uppercase text-charcoal/60 hover:text-charcoal hover:bg-black/5 rounded transition-all">CONFIG</button>
<button class="px-3 py-1 font-headline text-[9px] font-bold tracking-widest uppercase text-charcoal/60 hover:text-charcoal hover:bg-black/5 rounded transition-all">SAVE</button>
<button class="px-3 py-1 font-headline text-[9px] font-bold tracking-widest uppercase text-charcoal/60 hover:text-charcoal hover:bg-black/5 rounded transition-all">LOAD</button>
<button class="px-3 py-1 font-headline text-[9px] font-bold tracking-widest uppercase text-charcoal/60 hover:text-charcoal hover:bg-black/5 rounded transition-all">TL</button>
<button class="px-3 py-1 font-headline text-[9px] font-bold tracking-widest uppercase text-charcoal/60 hover:text-charcoal hover:bg-black/5 rounded transition-all">PREV</button>
<button class="px-4 py-1 font-headline text-[9px] font-bold tracking-widest uppercase text-white bg-sky-accent rounded-full shadow-md transition-all hover:bg-sky-600">AUTO</button>
<button class="px-3 py-1 font-headline text-[9px] font-bold tracking-widest uppercase text-charcoal/60 hover:text-charcoal hover:bg-black/5 rounded transition-all">SKIP</button>
</div>
</nav>
