<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Noto+Serif+SC:wght@300;400;500;600&amp;family=Inter:wght@400;500&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "blush-base": "#fff0f3",
              "blush-panel": "rgba(255, 240, 243, 0.75)",
              "blush-primary": "#ff80ab",
              "blush-accent": "#ff007f",
              "warm-grey": "#3d3b3c",
              "soft-rose": "#fce4ec",
              "on-surface": "#3d3b3c",
              "primary": "#ff007f"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Noto Serif SC", "serif"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style type="text/tailwindcss">
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .pattern-overlay {
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M25,10 c-5,0 -10,5 -10,10 c0,5 5,10 10,10 c5,0 10,-5 10,-10 c0,-5 -5,-10 -10,-10 z M60,40 c-3,0 -6,3 -6,6 c0,3 3,6 6,6 c3,0 6,-3 6,-6 c0,-3 -3,-6 -6,-6 z M85,15 c-4,0 -8,4 -8,8 c0,4 4,8 8,8 c4,0 8,-4 8,-8 c0,-4 -4,-8 -8,-8 z M15,75 c-6,0 -12,6 -12,12 c0,6 6,12 12,12 c6,0 12,-6 12,-12 c0,-6 -6,-12 -12,-12 z M70,80 c-5,0 -10,5 -10,10 c0,5 5,10 10,10 c5,0 10,-5 10,-10 c0,-5 -5,-10 -10,-10 z' fill='%23ff80ab' fill-opacity='0.4'/%3E%3Cpath d='M30,20 q-5,10 5,20 q10,-5 0,-20 z' fill='%23ff80ab' fill-opacity='0.2' transform='rotate(45 30 20)'/%3E%3Cpath d='M75,60 q-3,6 3,12 q6,-3 0,-12 z' fill='%23ff80ab' fill-opacity='0.3' transform='rotate(-20 75 60)'/%3E%3C/svg%3E");
            background-size: 120px 120px;
        }
        .glass-panel {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .text-shadow-dreamy {
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
        }
    
        @keyframes ken-burns {
            0% {
                transform: scale(1.05) translate(0, 0);
            }
            50% {
                transform: scale(1.15) translate(-1%, -1%);
            }
            100% {
                transform: scale(1.05) translate(0, 0);
            }
        }
        .animate-ken-burns {
            animation: ken-burns 30s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-[#131316] text-on-surface font-body overflow-hidden h-screen w-screen selection:bg-blush-primary selection:text-white">
<div class="fixed inset-0 z-0">
<img class="w-full h-full object-cover scale-105 brightness-90 animate-ken-burns" data-alt="Cinematic sunset view of city skyline through a bedroom window" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA7pbg4lQ7Gwzzs55TXr8o348rU_PhsLIPXy1fWUAtM4-SHP6qFsrH6ZlEyIlGAV_HYHJalQTQ0po7_bkQn8YC7xSt1iS6RzBobMpKMz33Ehrz-g3k3kanVeXrIObcjlFslNM7iqObjepszK3MnwRmUjFNN-Ad_FSaSErO8nkjDHi6kmVnfSFEnaI5CVPcMFaSZtOUSsnFqxH6FZExgn96EeAenseurVpd9QSofGfnKUT337UzG2ThmUsnmpcb29vygjnwFJ1PViVw"/>
<div class="absolute inset-0 bg-gradient-to-t from-blush-base/30 via-transparent to-transparent"></div>
</div>
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-8 py-4 bg-pink-500/20 backdrop-blur-md border-b border-white/20">
<div class="flex items-center gap-6">
<h1 class="text-lg font-bold text-warm-grey tracking-tighter uppercase font-headline">The Ethereal Manuscript</h1>
<div class="h-4 w-px bg-warm-grey/20"></div>
<div class="flex gap-4">
<span class="font-headline font-bold tracking-[0.05em] uppercase text-xs text-warm-grey">London, 1888</span>
<span class="font-headline font-bold tracking-[0.05em] uppercase text-xs text-warm-grey/60">22:15</span>
</div>
</div>
<div class="flex gap-4">
<button class="p-2 text-warm-grey hover:bg-white/40 transition-colors duration-200 rounded-full">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
<button class="p-2 text-warm-grey hover:bg-white/40 transition-colors duration-200 rounded-full">
<span class="material-symbols-outlined" data-icon="map">map</span>
</button>
<button class="p-2 text-warm-grey hover:bg-white/40 transition-colors duration-200 rounded-full">
<span class="material-symbols-outlined" data-icon="schedule">schedule</span>
</button>
</div>
</header>
<main class="relative z-10 h-full w-full flex flex-col px-12 pb-24">
<div class="max-w-5xl mx-auto w-full mb-0 flex justify-end gap-3 px-8">
<button class="glass-panel bg-white/40 hover:bg-white/60 text-warm-grey px-5 py-2 rounded-t-lg font-headline font-bold text-[10px] uppercase tracking-[0.2em] flex items-center gap-2 transition-all border-x border-t border-white/30">
<span class="material-symbols-outlined text-sm opacity-70">refresh</span>
<span>重绘当前</span>
</button>
<button class="glass-panel bg-[#ff007f]/20 hover:bg-[#ff007f]/40 text-[#ff007f] px-5 py-2 rounded-t-lg font-headline font-bold text-[10px] uppercase tracking-[0.2em] flex items-center gap-2 transition-all border-x border-t border-[#ff007f]/30">
<span class="material-symbols-outlined text-sm">keyboard</span>
<span>自由对话</span>
</button>
</div>
<div class="flex-grow flex items-center justify-center mb-12">
<div class="flex flex-col gap-6 w-full max-w-lg justify-center px-4">
<button class="relative group overflow-hidden glass-panel bg-blush-panel hover:bg-white/80 transition-all duration-300 px-8 py-5 rounded-xl border border-white/40 shadow-xl w-full">
<div class="absolute inset-0 pattern-overlay opacity-20 pointer-events-none group-hover:opacity-40"></div>
<span class="relative z-10 text-warm-grey font-headline font-bold text-sm uppercase tracking-[0.2em]">Investigate the manuscript</span>
</button>
<button class="relative group overflow-hidden glass-panel bg-blush-panel hover:bg-white/80 transition-all duration-300 px-8 py-5 rounded-xl border border-white/40 shadow-xl w-full">
<div class="absolute inset-0 pattern-overlay opacity-20 pointer-events-none group-hover:opacity-40"></div>
<span class="relative z-10 text-warm-grey font-headline font-bold text-sm uppercase tracking-[0.2em]">Wait for Alastair</span>
</button>
</div>
</div>
<div class="max-w-5xl mx-auto w-full relative">
<div class="absolute -top-6 left-8 z-20">
<div class="bg-[#fce4ec] px-10 py-2.5 rounded-full shadow-md transform -skew-x-12 border border-blush-primary/30">
<span class="font-headline font-bold tracking-widest text-sm uppercase skew-x-12 block text-[#ff007f]">旁白</span>
</div>
</div>
<div class="bg-pink-100/60 glass-panel rounded-xl overflow-hidden min-h-[160px] flex flex-col p-10 border border-pink-200/50 shadow-2xl relative">
<div class="absolute inset-0 pattern-overlay opacity-50 pointer-events-none"></div>
<div class="relative z-10 flex-grow">
<p class="text-warm-grey text-xl leading-relaxed font-body font-normal tracking-wide text-shadow-dreamy">
                    夕阳的余晖在地板上拉出长长的影子，空气中弥漫着淡淡的尘埃和过往岁月的味道。窗外的城市正在缓慢地沉入蓝调的梦境，而这个房间却仿佛被时间遗忘了，停留在那个永恒的黄昏之中。
<span class="inline-flex items-center ml-3 text-sm font-headline font-bold tracking-widest cursor-pointer hover:text-blush-accent transition-colors text-[#ff007f]">
                        继续 <span class="material-symbols-outlined text-lg leading-none">arrow_drop_down</span>
</span>
</p>
</div>
</div>
</div>
</main>
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-center py-4 px-12 pb-safe bg-pink-500/20 backdrop-blur-md border-t border-white/40">
<div class="flex items-center gap-2">
<button class="px-3 py-1 font-headline text-[10px] font-bold tracking-widest uppercase text-warm-grey/60 hover:text-warm-grey hover:bg-white/20 rounded transition-all">LOG</button>
<button class="px-3 py-1 font-headline text-[10px] font-bold tracking-widest uppercase text-warm-grey/60 hover:text-warm-grey hover:bg-white/20 rounded transition-all">CLOSE</button>
<button class="px-3 py-1 font-headline text-[10px] font-bold tracking-widest uppercase text-warm-grey/60 hover:text-warm-grey hover:bg-white/20 rounded transition-all">VIEW</button>
<button class="px-3 py-1 font-headline text-[10px] font-bold tracking-widest uppercase text-warm-grey/60 hover:text-warm-grey hover:bg-white/20 rounded transition-all">CONFIG</button>
<button class="px-3 py-1 font-headline text-[10px] font-bold tracking-widest uppercase text-warm-grey/60 hover:text-warm-grey hover:bg-white/20 rounded transition-all">SAVE</button>
<button class="px-3 py-1 font-headline text-[10px] font-bold tracking-widest uppercase text-warm-grey/60 hover:text-warm-grey hover:bg-white/20 rounded transition-all">LOAD</button>
<button class="px-3 py-1 font-headline text-[10px] font-bold tracking-widest uppercase text-warm-grey/60 hover:text-warm-grey hover:bg-white/20 rounded transition-all">TL</button>
<button class="px-3 py-1 font-headline text-[10px] font-bold tracking-widest uppercase text-warm-grey/60 hover:text-warm-grey hover:bg-white/20 rounded transition-all">PREV</button>
<button class="px-4 py-1 font-headline text-[10px] font-bold tracking-widest uppercase text-white rounded-full shadow-lg transition-all hover:bg-blush-accent bg-[#ff007f]">AUTO</button>
<button class="px-3 py-1 font-headline text-[10px] font-bold tracking-widest uppercase text-warm-grey/60 hover:text-warm-grey hover:bg-white/20 rounded transition-all">SKIP</button>
</div>
</nav>
