</button>

<span class="relative z-10 text-zinc-100 font-headline font-bold text-sm uppercase tracking-[0.2em]">Wait for Alastair</span>

</div>
<div class="max-w-5xl mx-auto w-full relative">

<p class="text-on-surface text-xl leading-relaxed font-body font-normal tracking-wide text-shadow-subtle">
                    夕阳的余晖在地板上拉出长长的影子，空气中弥漫着淡淡的尘埃和过往岁月的味道。窗外的城市正在缓慢地沉入蓝调的梦境，而这个房间却仿佛被时间遗忘了，停留在那个永恒的黄昏之中。
                 <span class="inline-flex items-center ml-2 text-primary opacity-80"><span class="material-symbols-outlined text-base leading-none translate-y-[2px]">arrow_drop_down</span></span></p>

</div>
